<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Mapa de posiciones del fondo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #f4f4f4;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    /* ===== TOOLTIP PERMANENTE ELEGANTE ===== */
    .fund-tooltip {
      background: rgba(40, 40, 40, 0.92);
      color: #f1f1f1;
      border-radius: 8px;
      padding: 6px 10px;
      border: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }

    .fund-tooltip::before {
      display: none;
    }

    .tooltip-title {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 2px;
    }

    .tooltip-sub {
      font-size: 0.75rem;
      color: #cfcfcf;
      line-height: 1.3;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // =========================
  // DATOS DESDE DJANGO
  // =========================
  const POSITIONS = [
    {% for position in positions %}
      {% if position.product.location %}
        {
          name: "{{ position.product.name|escapejs }}",
          country: "{{ position.product.country.name|escapejs }}",
          quantity: "{{ position.quantity }}",
          avg_price: "{{ position.avg_price }}",
          lat: "{{ position.product.location.y|stringformat:'f' }}",
          lng: "{{ position.product.location.x|stringformat:'f' }}"
        },
      {% endif %}
    {% endfor %}
  ];
</script>

<script>
console.log("Leaflet cargado:", L);

/* =====================================================
   MAPA BASE — VISTA GLOBAL
===================================================== */
const map = L.map("map", {
  zoomControl: true,
  attributionControl: true
}).setView([29.628572933706828, -38.79855065340232], 3.5);

/* =====================================================
   CAPAS BASE
===================================================== */
const baseLayers = {
  "Gris (Carto)": L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
    { attribution: "&copy; OpenStreetMap &copy; CARTO", maxZoom: 18 }
  ),
  "OpenStreetMap": L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    { attribution: "&copy; OpenStreetMap", maxZoom: 19 }
  )
};
baseLayers["Gris (Carto)"].addTo(map);

/* =====================================================
   CAPAS DE DATOS
===================================================== */
const positionsLayer = L.layerGroup().addTo(map);
const productsLayer  = L.layerGroup();

const mainMarketsLayer      = L.layerGroup().addTo(map);
const secondaryMarketsLayer = L.layerGroup();
const frontierMarketsLayer  = L.layerGroup();

/* =====================================================
   POSITIONS DEL FONDO (SIN ZOOM INICIAL)
===================================================== */
POSITIONS.forEach(p => {
  const lat = parseFloat(p.lat);
  const lng = parseFloat(p.lng);

  if (Number.isFinite(lat) && Number.isFinite(lng)) {
    const marker = L.marker([lat, lng]).addTo(positionsLayer);

    marker.bindTooltip(
      `
      <div style="font-weight:600">${p.name}</div>
      <div style="font-size:.85rem;opacity:.85">
        ${p.country}<br>
        Cantidad: <strong>${p.quantity}</strong><br>
        Precio medio: <strong>${p.avg_price}</strong>
      </div>
      `,
      { permanent: true, direction: "top", offset: [0, -12] }
    );
  }
});

/* =====================================================
   PRODUCTS
===================================================== */
POSITIONS.forEach(p => {
  const lat = parseFloat(p.lat);
  const lng = parseFloat(p.lng);

  if (Number.isFinite(lat) && Number.isFinite(lng)) {
    L.circleMarker([lat, lng], {
      radius: 6,
      color: "#374151",
      fillColor: "#6b7280",
      fillOpacity: 0.6
    })
    .bindTooltip(
      `<strong>${p.name}</strong><br><small>${p.country}</small>`
    )
    .addTo(productsLayer);
  }
});

/* =====================================================
   ICONO ELEGANTE (INSTITUCIONAL)
===================================================== */
const marketIcon = L.icon({
  iconUrl: "https://www.pikpng.com/pngl/m/418-4181445_auction-free-real-estate-icons-flaticon-real-estate.png",
  iconSize: [22, 22],
  iconAnchor: [11, 22]
});

/* =====================================================
   FUNCIÓN GENERADORA DE MERCADOS
===================================================== */
function addMarket(layer, market) {
  L.marker([market.lat, market.lng], { icon: marketIcon })
    .bindPopup(`
      <div style="font-weight:600">${market.name}</div>
      <div style="font-size:.85rem;line-height:1.4">
        ${market.description}
      </div>
    `)
    .addTo(layer);
}

/* =====================================================

/* =====================================================
   CONTROL DE CAPAS
===================================================== */
L.control.layers(
  baseLayers,
  {
    "📈 Positions del fondo": positionsLayer,
    "📦 Products": productsLayer,
    "🏛️ Mercados principales": mainMarketsLayer,
    "🏢 Mercados secundarios": secondaryMarketsLayer,
