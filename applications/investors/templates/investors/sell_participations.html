{% extends "base.html" %}
{% block content %}
<div class="container py-4">
    <h3 class="mb-4">Venta de participaciones</h3>

    <form method="post" class="card p-4 shadow-sm">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Posición</label>
            <select name="position" class="form-select" required>
                {% for pos in positions %}
                    <option value="{{ pos.id }}">
                        {{ pos.investor.user.username }} —
                        {{ pos.fund.name }} —
                        {{ pos.participations|floatformat:4 }} NAVs
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Participaciones a vender</label>
            <input type="number" step="0.0001" name="participations" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">NAV aplicado</label>
            <input type="number" step="0.0001" name="nav_price" class="form-control" required>
        </div>

        <button class="btn btn-danger">
            Ejecutar venta
        </button>
    </form>
</div>
{% endblock %}
