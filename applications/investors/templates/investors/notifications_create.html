{% extends "base.html" %}
{% load static %}

{% block content %}
<style>
    :root {
        --fc-brand: #0b1f3a;
        --fc-accent: #3b82f6;
        --fc-light-bg: #f8fafc;
        --fc-border: #e2e8f0;
        --fc-radius: 20px;
    }

    .select-container {
        max-width: 800px;
        margin: 4rem auto;
        padding: 0 1.5rem;
    }

    /* CABECERA */
    .select-header {
        text-align: center;
        margin-bottom: 3rem;
    }

    .select-header h1 {
        font-weight: 800;
        color: var(--fc-brand);
        font-size: 2.5rem;
        letter-spacing: -1.5px;
        margin-bottom: 1rem;
    }

    .select-header p {
        color: #64748b;
        font-size: 1.1rem;
    }

    /* GRID DE OPCIONES */
    .select-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 1.5rem;
        margin-bottom: 3rem;
    }

    /* ESTILO TARJETA (RADIO BUTTON) */
    .option-card {
        cursor: pointer;
        position: relative;
    }

    .option-card.is-disabled {
        cursor: not-allowed;
    }

    .option-card.is-disabled .card-content {
        opacity: 0.5;
        filter: grayscale(0.7);
        border-color: #e5e7eb;
        box-shadow: none;
        transform: none;
    }

    .option-card input[type="radio"] {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
    }

    .card-content {
        background: white;
        border: 2px solid var(--fc-border);
        border-radius: var(--fc-radius);
        padding: 2.5rem 2rem;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    /* ICONOS POR OPCIÓN */
    .icon-box {
        width: 70px;
        height: 70px;
        border-radius: 18px;
        background: var(--fc-light-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: var(--fc-brand);
        margin-bottom: 1.5rem;
        transition: all 0.4s ease;
    }

    .option-card:hover .card-content {
        border-color: var(--fc-accent);
        transform: translateY(-8px);
        box-shadow: 0 12px 25px rgba(59, 130, 246, 0.1);
    }

    .option-card:hover .icon-box {
        background: rgba(59, 130, 246, 0.1);
        color: var(--fc-accent);
    }

    /* ESTADO SELECCIONADO */
    .option-card input[type="radio"]:checked + .card-content {
        border-color: var(--fc-brand);
        background: rgba(11, 31, 58, 0.02);
        box-shadow: 0 0 0 4px rgba(11, 31, 58, 0.1);
    }

    .option-card input[type="radio"]:checked + .card-content .icon-box {
        background: var(--fc-brand);
        color: white;
    }

    .option-card input[type="radio"]:checked + .card-content::after {
        content: '\F633'; /* Icono check de bi */
        font-family: 'bootstrap-icons';
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
        background: var(--fc-brand);
        color: white;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
    }

    .option-title {
        font-weight: 800;
        font-size: 1.3rem;
        color: var(--fc-brand);
        margin-bottom: 1rem;
    }

    .option-desc {
        color: #7f8c8d;
        font-size: 1rem;
        line-height: 1.5;
    }

    /* BOTÓN CONTINUAR */
    .btn-submit-container {
        display: flex;
        justify-content: center;
        gap: 1rem;
        flex-wrap: wrap;
    }

    .btn-fc-action {
        background: var(--fc-brand);
        color: white;
        padding: 1rem 3rem;
        border-radius: 50px;
        font-weight: 700;
        font-size: 1.1rem;
        border: none;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        box-shadow: 0 10px 20px rgba(11, 31, 58, 0.15);
    }

    .btn-fc-action:hover {
        background: var(--fc-accent);
        transform: scale(1.05);
        box-shadow: 0 15px 30px rgba(59, 130, 246, 0.3);
    }

    .btn-fc-back {
        background: #ffffff;
        color: var(--fc-brand);
        padding: 1rem 2.4rem;
        border-radius: 50px;
        font-weight: 700;
        font-size: 1.05rem;
        border: 2px solid rgba(11, 31, 58, 0.2);
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 0.6rem;
    }

    .btn-fc-back:hover {
        border-color: var(--fc-accent);
        color: var(--fc-brand);
        transform: translateY(-2px);
        box-shadow: 0 10px 18px rgba(11, 31, 58, 0.12);
    }
</style>

<div class="select-container">
    <div class="select-header">
        <h1>Emitir Nuevo Aviso</h1>
        <p>Selecciona el tipo de comunicación que deseas generar para tu inversor.</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="investor_id" value="{{ investor_id }}">

        <div class="select-grid">
            <!-- OPCIÓN 1: INFORMATIVO -->
            <label class="option-card {% if allow_only_monthly %}is-disabled{% endif %}">
                <input type="radio" name="template_type" value="INFO" required {% if allow_only_monthly %}disabled{% endif %}>
                <div class="card-content">
                    <div class="icon-box">
                        <i class="bi bi-megaphone-fill"></i>
                    </div>
                    <div class="option-title">Aviso Informativo</div>
                    <p class="option-desc">Generar un comunicado general sobre mercado, operativa o actualizaciones de servicio.</p>
                    {% if allow_only_monthly %}
                        <p class="option-desc" style="color: #94a3b8; font-size: 0.9rem;">Disponible solo para gestor.</p>
                    {% endif %}
                </div>
            </label>

            <!-- OPCIÓN 2: MENSUAL -->
            <label class="option-card">
                <input type="radio" name="template_type" value="MONTHLY_REPORT" required>
                <div class="card-content">
                    <div class="icon-box">
                        <i class="bi bi-file-earmark-bar-graph-fill"></i>
                    </div>
                    <div class="option-title">Informe Mensual</div>
                    <p class="option-desc">Resumen mensual con capital, rendimiento y valor liquidativo.</p>
                </div>
            </label>

            <!-- OPCIÓN 3: REPORTE DE COMPRA -->
            <label class="option-card">
                <input type="radio" name="template_type" value="BUY_REPORT" required>
                <div class="card-content">
                    <div class="icon-box">
                        <i class="bi bi-arrow-down-circle-fill"></i>
                    </div>
                    <div class="option-title">Reporte de Compra</div>
                    <p class="option-desc">Confirmación técnica de una suscripción concreta con fecha seleccionable.</p>
                </div>
            </label>

            <!-- OPCIÓN 4: REPORTE DE VENTA -->
            <label class="option-card">
                <input type="radio" name="template_type" value="SELL_REPORT" required>
                <div class="card-content">
                    <div class="icon-box">
                        <i class="bi bi-arrow-up-circle-fill"></i>
                    </div>
                    <div class="option-title">Reporte de Venta</div>
                    <p class="option-desc">Confirmación técnica de un reembolso concreto con fecha seleccionable.</p>
                </div>
            </label>
        </div>

        <div class="btn-submit-container">
            <a href="{% url 'investors:notification_list' %}?investor={{ investor_id }}" class="btn-fc-back">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
            <button type="submit" class="btn-fc-action">
                Continuar al editor
                <i class="bi bi-arrow-right-short" style="font-size: 1.5rem;"></i>
            </button>
        </div>
    </form>
</div>

<script>
    // Pequeño script para feedback visual al seleccionar
    document.querySelectorAll('input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', function() {
            console.log("Seleccionado:", this.value);
        });
    });
</script>

{% endblock %}
