{% extends "base.html" %}

{% block content %}
<div class="container py-4">

    <h3 class="fw-bold mb-4">Nuevo aviso</h3>

   <form method="post">
    {% csrf_token %}

    <input type="hidden" name="investor_id" value="{{ investor_id }}">

    <div class="mb-3">
        <label class="form-label">Tipo de aviso</label>
        <select name="template_type" class="form-select" required>
            <option value="">Selecciona una opción</option>
            <option value="INFO">Aviso informativo</option>
            <option value="MONTHLY_REPORT">Informe mensual (capital)</option>
        </select>
    </div>

    <button class="btn btn-primary">Continuar</button>
</form>

</div>
{% endblock %}
