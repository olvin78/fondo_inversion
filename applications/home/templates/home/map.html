<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Mapa de posiciones del fondo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #f4f4f4;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    /* ===== TOOLTIP PERMANENTE ELEGANTE ===== */
    .fund-tooltip {
      background: rgba(40, 40, 40, 0.92);
      color: #f1f1f1;
      border-radius: 8px;
      padding: 6px 10px;
      border: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }

    .fund-tooltip::before {
      display: none;
    }

    .tooltip-title {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 2px;
    }

    .tooltip-sub {
      font-size: 0.75rem;
      color: #cfcfcf;
      line-height: 1.3;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =====================================================
   DATOS DESDE DJANGO
===================================================== */
const POSITIONS = [
  {% for position in positions %}
    {% if position.product.location %}
      {
        name: "{{ position.product.name|escapejs }}",
        country: "{{ position.product.country.name|escapejs }}",
        quantity: "{{ position.quantity }}",
        avg_price: "{{ position.avg_price }}",
        lat: {{ position.product.location.y|stringformat:"f" }},
        lng: {{ position.product.location.x|stringformat:"f" }}
      },
    {% endif %}
  {% endfor %}
];

const MAP_ELEMENTS = [
  {% for el in map_elements %}
    {% if el.location %}
      {
        id: {{ el.id }},
        name: "{{ el.name|escapejs }}",
        type_code: "{{ el.element_type.code|escapejs }}",
        type_name: "{{ el.element_type.name|escapejs }}",
        icon: {% if el.element_type.icon %}"{{ el.element_type.icon.url }}"{% else %}null{% endif %},
        description: "{{ el.description|escapejs }}",
        lat: {{ el.location.y|stringformat:"f" }},
        lng: {{ el.location.x|stringformat:"f" }}
      },
    {% endif %}
  {% endfor %}
];

/* =====================================================
   MAPA BASE
===================================================== */
const map = L.map("map", {
  zoomControl: true,
  attributionControl: true
}).setView([25, 0], 3);

/* =====================================================
   CAPAS BASE
===================================================== */
const baseLayers = {
  "Gris (Carto)": L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
    { attribution: "&copy; OpenStreetMap &copy; CARTO", maxZoom: 18 }
  ),
  "OpenStreetMap": L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    { attribution: "&copy; OpenStreetMap", maxZoom: 19 }
  )
};

baseLayers["Gris (Carto)"].addTo(map);

/* =====================================================
   CAPAS DE DATOS
===================================================== */
const positionsLayer   = L.layerGroup().addTo(map);
const productsLayer    = L.layerGroup();
const mapElementsLayer = L.layerGroup().addTo(map);

/* =====================================================
   POSITIONS DEL FONDO
===================================================== */
POSITIONS.forEach(p => {
  if (!Number.isFinite(p.lat) || !Number.isFinite(p.lng)) return;

  const marker = L.marker([p.lat, p.lng]).addTo(positionsLayer);

  marker.bindTooltip(
    `
    <div style="font-weight:600">${p.name}</div>
    <div style="font-size:.85rem;opacity:.85">
      ${p.country}<br>
      Cantidad: <strong>${p.quantity}</strong><br>
      Precio medio: <strong>${p.avg_price}</strong>
    </div>
    `,
    { permanent: true, direction: "top", offset: [0, -12] }
  );
});

/* =====================================================
   PRODUCTS (CÍRCULOS)
===================================================== */
POSITIONS.forEach(p => {
  if (!Number.isFinite(p.lat) || !Number.isFinite(p.lng)) return;

  L.circleMarker([p.lat, p.lng], {
    radius: 6,
    color: "#374151",
    fillColor: "#6b7280",
    fillOpacity: 0.6
  })
  .bindTooltip(
    `<strong>${p.name}</strong><br><small>${p.country}</small>`
  )
  .addTo(productsLayer);
});

/* =====================================================
   ICONOS DINÁMICOS PARA MAP ELEMENTS
===================================================== */
const iconCache = {};

function getIcon(url) {
  if (!url) {
    url = "https://cdn-icons-png.flaticon.com/512/684/684908.png";
  }
  if (!iconCache[url]) {
    iconCache[url] = L.icon({
      iconUrl: url,
      iconSize: [24, 24],
      iconAnchor: [12, 24],
      popupAnchor: [0, -24]
    });
  }
  return iconCache[url];
}

/* =====================================================
   MAP ELEMENTS (BD)
===================================================== */
MAP_ELEMENTS.forEach(el => {
  if (!Number.isFinite(el.lat) || !Number.isFinite(el.lng)) return;

  const marker = L.marker(
    [el.lat, el.lng],
    { icon: getIcon(el.icon) }
  ).addTo(mapElementsLayer);

  marker.bindPopup(
    `
    <div style="font-weight:600">${el.name}</div>
    <div style="font-size:.85rem;opacity:.85">
      ${el.type_name}<br>
      ${el.description || ""}
    </div>
    `
  );
});

/* =====================================================
   CONTROL DE CAPAS
===================================================== */
L.control.layers(
  baseLayers,
  {
    "📈 Positions del fondo": positionsLayer,
    "📦 Products": productsLayer,
    "🗺️ Elementos del mercado": mapElementsLayer
  },
  { collapsed: false }
).addTo(map);

/* =====================================================
   FIX RESIZE
===================================================== */
setTimeout(() => map.invalidateSize(), 200);
</script>


</body>
</html>
