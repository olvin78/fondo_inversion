version: '3.9'


services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - fondo_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery:
    build: .
    command: celery -A core.celery worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
    depends_on:
      - web
    networks:
      - fondo_net
  celery_beat:
    build: .
    command: celery -A core.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - web
      - redis
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
    networks:
      - fondo_net




networks:
  fondo_net:
    driver: bridge

