version: "3.9"

services:
  web:
    container_name: fondo_inversion-web
    build: .
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - fondo_net

  celery:
    container_name: fondo_inversion-celery
    build: .
    command: celery -A core.celery worker -l info
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - fondo_net

  celery_beat:
    container_name: fondo_inversion-celery_beat
    build: .
    command: celery -A core.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - fondo_net

  redis:
    container_name: fondo_inversion-redis
    image: redis:7
    restart: unless-stopped
    networks:
      - fondo_net

  db:
    container_name: fondo_inversion-db
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: fondo
      POSTGRES_USER: fondo
      POSTGRES_PASSWORD: fondo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fondo_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fondo -d fondo" ]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  fondo_net:
    driver: bridge

volumes:
  postgres_data:
