services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./media:/app/media
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - fondo_net

  celery:
    build: .
    command: celery -A core.celery worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
    depends_on:
      - redis
    networks:
      - fondo_net

  celery_beat:
    build: .
    command: celery -A core.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
    depends_on:
      - redis
    networks:
      - fondo_net

  redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - fondo_net
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: fondo
      POSTGRES_USER: fondo
      POSTGRES_PASSWORD: fondo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fondo_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fondo -d fondo" ]
      interval: 5s
      timeout: 5s
      retries: 5
networks:
  fondo_net:
    driver: bridge

volumes:
  postgres_data:
