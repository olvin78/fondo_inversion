version: "3.9"

services:
  web:
    container_name: fondo_inversion-web
    build: .
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "127.0.0.1:8003:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fondo_net
    restart: unless-stopped

  db:
    container_name: fondo_inversion-db
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: fondo
      POSTGRES_USER: fondo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fondo_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fondo -d fondo" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  fondo_net:
    driver: bridge

volumes:
  postgres_data:
